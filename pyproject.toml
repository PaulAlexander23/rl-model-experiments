[project]
name = "rl-experiments"
version = "0.1.0"
description = "PPO architecture experiments (shared vs split actor-critic, LSTM/GRU/Transformer) and CPU/GPU device strategies with Stable-Baselines3."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.6",
    "stable-baselines3>=2.4",
    "sb3-contrib>=2.4",
    "gymnasium[box2d,classic-control]>=1.0",
    "hydra-core>=1.3",
    "hydra-joblib-launcher>=1.2",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "tensorboard>=2.17",
    "tabulate>=0.10.0",
    "jax[cuda12]>=0.6",
    "flax>=0.12.10",
    "optax>=0.2.8",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pyright>=1.1.380",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pre-commit>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rl_experiments"]

# The GTX 1080 is Pascal (sm_61); CUDA 12.8+ wheels dropped Pascal, cu126 still ships it.
[tool.uv.sources]
torch = [{ index = "pytorch-cu126" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[project.scripts]
rl-train = "rl_experiments.train:main"
rl-train-jax = "rl_experiments.jaxrl.run:main"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["runs", "runs_jax", "multirun", "outputs"]

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle, pyflakes
    "I",            # isort
    "UP",           # pyupgrade
    "B",            # bugbear
    "SIM",          # simplify
    "C4",           # comprehensions
    "PTH",          # pathlib over os.path
    "RUF",          # ruff-specific
    "NPY",          # numpy
    "PT",           # pytest style
    "PL",           # pylint subset
]
ignore = ["PLR0913", "PLR0917", "PLR2004"]  # many-args is normal for builders; magic numbers are fine in tests/configs

[tool.ruff.lint.per-file-ignores]
"src/rl_experiments/jaxrl/run.py" = ["E402"]  # XLA allocator env var must be set before importing jax

[tool.ruff.format]
docstring-code-format = true

[tool.pyright]
include = ["src", "tests", "scripts"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=rl_experiments --cov-report=term-missing"
filterwarnings = [
    "ignore::DeprecationWarning:pygame.*",
    "ignore:You are trying to run PPO on the GPU:UserWarning",
]

[tool.coverage.run]
branch = true
source = ["rl_experiments"]

[tool.coverage.report]
fail_under = 85
exclude_also = ["if __name__ == .__main__.:"]
