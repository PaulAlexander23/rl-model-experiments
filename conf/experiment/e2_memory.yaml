# @package _global_
# E2: memory architectures on velocity-masked (partially observable) tasks.
defaults:
  - override /hydra/launcher: joblib

experiment: e2_memory
torch_threads: 1
hydra:
  launcher:
    n_jobs: 14
  sweeper:
    params:
      env: cartpole_novel,pendulum_novel
      model: split_mlp,framestack_mlp,transformer,lstm,gru,lstm_shared,lstm_shared_detached,gru_shared
      seed: 0,1,2
