# @package _global_
# E4c: shared_mlp_vf01 without reward normalisation (E1 already has shared/split without it).
defaults:
  - override /hydra/launcher: joblib

experiment: e4_value_scale
torch_threads: 1
hydra:
  launcher:
    n_jobs: 13
  sweep:
    subdir: ${env.name}/${model.name}/norm_reward_${env.norm_reward}/s${seed}
  sweeper:
    params:
      env: cartpole,acrobot,lunarlander
      model: shared_mlp_vf01
      seed: 0,1,2,3,4
