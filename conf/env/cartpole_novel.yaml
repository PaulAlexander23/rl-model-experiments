# CartPole without velocities: a POMDP that needs memory (or a frame stack) to solve.
defaults:
  - cartpole
  - _self_
name: cartpole_novel
mask_velocity: true
total_timesteps: 200_000
ppo:
  n_steps: 128
  batch_size: 256
  gae_lambda: 0.95
  gamma: 0.99
  n_epochs: 10
  learning_rate: lin_0.001
  clip_range: 0.2
