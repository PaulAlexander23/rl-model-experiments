name: pendulum
id: Pendulum-v1
mask_velocity: false
# Returns are O(-1000); normalising obs and rewards (as rl-zoo does for PendulumNoVel) stabilises the critic.
normalize: true
n_envs: 4
total_timesteps: 200_000
ppo:
  n_steps: 1024
  batch_size: 64
  gae_lambda: 0.95
  gamma: 0.9
  n_epochs: 10
  ent_coef: 0.0
  learning_rate: 1e-3
  clip_range: 0.2
  use_sde: true
  sde_sample_freq: 4
